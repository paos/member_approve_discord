services:
  membership:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/membership.sqlite3
    ports:
      - "127.0.0.1:8766:8766"
    volumes:
      - membership-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  membership-data:
